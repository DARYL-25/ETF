# Every trading day: issuer NAVs, sizes, exchange rates. Then the live database, when configured.
name: Daily prices
on:
  push:
    branches: [phase-1-mvp]
    paths: [".github/workflows/daily.yml", "scripts/universe/daily.py"]
  schedule:
    - cron: "23 5 * * 2-6"
  workflow_dispatch:
concurrency:
  group: data
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install openpyxl
      - run: python3 scripts/universe/details.py
        env:
          SOURCES: ssga_us,ishares,spdr_eu
      - run: python3 scripts/universe/daily.py
      - name: Commit results
        run: |
          git config user.name "etf-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "$MESSAGE"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push
        env:
          MESSAGE: Daily prices and exchange rates
      - name: Load into the live database, when one is configured
        env:
          SYNC_DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
        run: |
          if [ -n "$SYNC_DATABASE_URL" ]; then npm ci --no-audit --no-fund && npx tsx scripts/sync-db.ts; else echo "No SYNC_DATABASE_URL secret, skipped."; fi
