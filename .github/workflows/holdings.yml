# Weekly: full holdings from issuers that publish them as files.
name: Weekly holdings
on:
  schedule:
    - cron: "37 6 * * 0"
  workflow_dispatch:
concurrency:
  group: data
permissions:
  contents: write
jobs:
  holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install openpyxl
      - run: python3 scripts/universe/holdings.py
      - name: Commit results
        run: |
          git config user.name "etf-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "$MESSAGE"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push
        env:
          MESSAGE: Update holdings
