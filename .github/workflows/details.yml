name: Update ETF details
on:
  push:
    branches: [phase-1-mvp]
    paths: ["scripts/universe/details.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: universe
jobs:
  details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pdfplumber
      - run: python3 scripts/universe/details.py
      - run: |
          git config user.name "etf-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/universe/details
          git diff --cached --quiet || git commit -m "Update ETF details"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push
