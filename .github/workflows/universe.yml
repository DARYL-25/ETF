name: Update ETF universe
on:
  push:
    branches: [phase-1-mvp]
    paths: ["scripts/universe/**", ".github/workflows/universe.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xlrd openpyxl
      - run: python scripts/universe/fetch.py
      - name: Commit results
        run: |
          git config user.name "etf-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/universe
          git diff --cached --quiet || git commit -m "Update ETF universe lists"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
