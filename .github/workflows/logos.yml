name: Update issuer logos
on:
  push:
    branches: [phase-1-mvp]
    paths: ["scripts/universe/logos.py"]
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/universe/logos.py
      - run: |
          git config user.name "etf-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/logos
          git diff --cached --quiet || git commit -m "Update issuer logos"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push
