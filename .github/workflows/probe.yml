name: Probe data sources
on:
  push:
    branches: [phase-1-mvp]
    paths: ["scripts/universe/probe.py"]
permissions:
  contents: write
concurrency:
  group: universe
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/universe/probe.py
      - run: |
          git config user.name "etf-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/universe/probe.json
          git diff --cached --quiet || git commit -m "Update data source probe"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push
