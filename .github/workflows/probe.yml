name: Probe data sources
on:
  push:
    branches: [source-probe]
    paths: ["scripts/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
